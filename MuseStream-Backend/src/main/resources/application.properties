# ---------------------------------------------------------
# MuseStream Backend configuration
# Values can be overridden with environment variables or a
# local ".env" file (see .env.example).
# ---------------------------------------------------------
spring.application.name=musestream-backend
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/musestream
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate (schema is owned by schema.sql) ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Run schema.sql + data.sql on startup (both are idempotent) ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8

# --- JWT ---
# JWT_SECRET must be at least 32 characters. CHANGE IT in production.
app.jwt.secret=${JWT_SECRET:musestream-dev-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS (React dev servers: Vite 5173, CRA 3000) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Misc ---
# Dev aid: 500 responses include the exception class/message. Set ERROR_DETAILS=false in production.
app.error-details=${ERROR_DETAILS:true}
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
server.error.include-stacktrace=never
